<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday 🎂</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3,
                #a18cd1
            );
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 25px;
            background: rgba(255,255,255,0.18);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
            animation: bounce 1.5s infinite;
        }

        h2 {
            font-size: 32px;
            margin: 10px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #ff4f81;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: #ffe4ec;
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            animation: fadeIn 1s ease;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: 50px;
            animation: float 8s linear infinite;
        }

        .b1 { left: 10%; animation-delay: 1s; }
        .b2 { left: 30%; animation-delay: 3s; }
        .b3 { left: 60%; animation-delay: 0s; }
        .b4 { left: 80%; animation-delay: 2s; }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes float {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-120vh);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <div class="container">

        <h1>🎂 Happy Birthday! 🎉</h1>

        <h2>Dear [Naveen]❤️</h2>

        <p>
            Wishing you a very Happy Birthday! 🥳
            <br>
            May your day be filled with happiness,
            laughter, love and beautiful memories. ✨
        </p>

        <button onclick="showMessage()">
            💝 Click for a Surprise
        </button>

        <div id="message">
            🎁 You are an amazing person! 🎁
            <br><br>
            May all your dreams come true.
            <br>
            Have the most wonderful birthday ever! ❤️🎂
        </div>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
